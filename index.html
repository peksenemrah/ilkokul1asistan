<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ilkokul1 Asistan</title>
<meta name="description" content="ilkokul1.com Yayınları çözümlü kitaplar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ee; --card:#ffffff; --ink:#2b2340; --muted:#6b6380;
  --brand:#ff7a3d; --brand-dk:#e35f22; --accent:#3d8bff; --line:#f0e3d2;
  --chip:#fff1e4; --shadow:0 10px 30px rgba(120,70,20,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1726; --card:#262036; --ink:#f4efff; --muted:#b3aacb;
    --brand:#ff8a52; --brand-dk:#ff7a3d; --accent:#6aa6ff; --line:#3a3150;
    --chip:#33293f; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1726; --card:#262036; --ink:#f4efff; --muted:#b3aacb;
  --brand:#ff8a52; --brand-dk:#ff7a3d; --accent:#6aa6ff; --line:#3a3150;
  --chip:#33293f; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.5;
  background-image:radial-gradient(circle at 10% 0%,rgba(255,122,61,.14),transparent 40%),radial-gradient(circle at 95% 20%,rgba(61,139,255,.12),transparent 40%)}
.wrap{max-width:880px;margin:0 auto;padding:40px 16px 64px}
header{text-align:center;margin-bottom:32px}
.logo{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(2rem,6vw,3rem);margin:0;letter-spacing:-.5px}
.logo span{color:var(--brand)}
.sub{color:var(--muted);margin:4px 0 0;font-weight:600}
.book{background:var(--card);border:2px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.book-btn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:16px;padding:22px 24px;
  background:linear-gradient(135deg,var(--brand),#ffb13d);color:#fff}
.book-btn:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.badge{flex:none;width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.25);display:grid;place-items:center;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:2rem;line-height:1}
.badge small{display:block;font-size:.7rem;font-weight:700;margin-top:-6px}
.book-title{flex:1;min-width:0}
.book-title b{display:block;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(1.15rem,3.6vw,1.6rem);line-height:1.15}
.book-title em{font-style:normal;opacity:.92;font-weight:600;font-size:.95rem}
.chev{flex:none;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;transition:transform .25s}
.book.open .chev{transform:rotate(180deg)}
.weeks{display:none;padding:20px;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.book.open .weeks{display:grid}
.week{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--chip);border:2px solid transparent;
  color:var(--ink);text-decoration:none;font-weight:700;transition:border-color .15s,transform .15s}
.week:hover,.week:focus-visible{border-color:var(--brand);transform:translateY(-2px);outline:none}
.num{flex:none;width:40px;height:40px;border-radius:12px;background:var(--card);color:var(--brand-dk);display:grid;place-items:center;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.25rem}
.week span{display:block;font-size:.95rem}
.week small{display:block;color:var(--muted);font-weight:600;font-size:.78rem}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:32px}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo">ilkokul1<span>asistan</span></h1>
    <p class="sub">ilkokul1.com Yayınları · Çözümlü Kitaplar</p>
  </header>

  <section class="book" id="b4">
    <button class="book-btn" aria-expanded="false" aria-controls="w4">
      <div class="badge">4<small>SINIF</small></div>
      <div class="book-title">
        <b>4. Sınıf Harika Beyinler Hafta Sonu Ödevim</b>
        <em>36 hafta · Türkçe, Matematik, Fen Bilimleri, Sosyal Bilgiler</em>
      </div>
      <div class="chev" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </button>
    <div class="weeks" id="w4"></div>
  </section>

  <footer>© ilkokul1.com Yayınları · <a href="https://ilkokul1.com">ilkokul1.com</a></footer>
</div>
<script>
(function(){
  var box=document.getElementById('w4'), book=document.getElementById('b4'), btn=book.querySelector('.book-btn');
  for(var i=1;i<=36;i++){
    var n=(i<10?'0':'')+i, a=document.createElement('a');
    a.className='week'; a.href='pdf/4-sinif/hafta-'+n+'.pdf'; a.target='_blank'; a.rel='noopener';
    a.innerHTML='<div class="num">'+i+'</div><div><span>'+i+'. Hafta</span><small>PDF · 4 sayfa</small></div>';
    box.appendChild(a);
  }
  btn.addEventListener('click',function(){
    var o=book.classList.toggle('open'); btn.setAttribute('aria-expanded',o);
  });
})();
</script>
</body>
</html>
